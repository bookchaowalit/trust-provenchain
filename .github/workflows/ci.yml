# CI + security baseline (DevSecOps Phase 1). Public repository: GitHub-hosted runners.
# Nothing is deployed from this repository; the contract is compiled and tested locally only.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  provenchain:
    # `npm test` runs node --test: document hashing, a solc compile of NotaryRegistry.sol and
    # behaviour tests of the compiled contract in an in-process EVM (no network).
    # `npm run typecheck` runs tsc --noEmit with strict checkJs over src/, scripts/ and tests/.
    uses: bookchaowalit/platform-ci-workflows/.github/workflows/ci-node.yml@87dc5e1c7e0416886a6371d5a101bb2ccba38edd # v1.1.1
    with:
      node-version: "22" # package.json engines: node >=20
      lint-command: "" # follow-up: no linter configured yet (plain ESM .mjs); adopt Biome separately
      typecheck-command: auto # npm run typecheck
      require-tests: true

  security:
    uses: bookchaowalit/platform-ci-workflows/.github/workflows/security.yml@87dc5e1c7e0416886a6371d5a101bb2ccba38edd # v1.1.1
